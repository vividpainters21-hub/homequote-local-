<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meme Jarvis — Fomo Capture</title>
    <style>
      body {
        font-family: -apple-system, Segoe UI, Arial, sans-serif;
        width: 320px;
        padding: 12px;
        background: #0b0e14;
        color: #e6e8ee;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #9aa3b2;
        margin-top: 8px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #2a2f3a;
        background: #131722;
        color: #e6e8ee;
        font-size: 12px;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: none;
        font-weight: 600;
        cursor: pointer;
      }
      #enableBtn {
        background: #22c55e;
        color: #06210f;
      }
      #disableBtn {
        background: #ef4444;
        color: #2a0505;
      }
      #saveBtn {
        background: #3b82f6;
        color: #04122c;
      }
      .status {
        margin-top: 10px;
        font-size: 11px;
        color: #9aa3b2;
        line-height: 1.5;
      }
      .warn {
        margin-top: 10px;
        padding: 8px;
        border-radius: 6px;
        background: #2a1f0a;
        color: #f5c451;
        font-size: 11px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Meme Jarvis — Fomo Capture</h1>

    <div class="warn">
      Read-only. Runs only on the current tab after you click Enable. Never
      reads or stores your Fomo password. This integration relies on
      undocumented page behavior and may need re-tuning if Fomo changes its
      app — see extension/README.md.
    </div>

    <label for="currentOrigin">Current tab</label>
    <input id="currentOrigin" disabled />

    <button id="enableBtn">Enable capture on this tab</button>
    <button id="disableBtn">Disable capture</button>

    <label for="backendUrl">Backend ingest URL</label>
    <input id="backendUrl" placeholder="http://localhost:4000/api/fomo/ingest" />

    <label for="apiKey">Backend API key</label>
    <input id="apiKey" type="password" placeholder="FOMO_INGEST_API_KEY" />

    <label for="endpointFilter">Endpoint filter (optional substring)</label>
    <input id="endpointFilter" placeholder="e.g. /api/feed" />

    <button id="saveBtn">Save settings</button>

    <div class="status" id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
